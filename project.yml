name: ReadToScroll
options:
  bundleIdPrefix: com.joshhinder
  deploymentTarget:
    iOS: "17.0"
packages:
  RewardCore:
    path: Packages/RewardCore
settings:
  base:
    DEVELOPMENT_TEAM: M37XS4G2JJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ReadToScroll:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: RewardCore
      - target: ReadToScrollMonitor
      - target: ReadToScrollShield
      - target: ReadToScrollShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshhinder.readtoscroll
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Read to Scroll
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/ReadToScroll.entitlements
      properties: &entitlements
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.joshhinder.readtoscroll]

  ReadToScrollMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    dependencies:
      - package: RewardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshhinder.readtoscroll.monitor
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: ReadToScrollMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ReadToScrollMonitor
    entitlements:
      path: Monitor/Monitor.entitlements
      properties: *entitlements

  ReadToScrollShield:
    type: app-extension
    platform: iOS
    sources: [Shield, Shared]
    dependencies:
      - package: RewardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshhinder.readtoscroll.shield
    info:
      path: Shield/Info.plist
      properties:
        CFBundleDisplayName: ReadToScrollShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Shield/Shield.entitlements
      properties: *entitlements

  ReadToScrollShieldAction:
    type: app-extension
    platform: iOS
    sources: [ShieldAction, Shared]
    dependencies:
      - package: RewardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshhinder.readtoscroll.shieldaction
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ReadToScrollShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties: *entitlements
